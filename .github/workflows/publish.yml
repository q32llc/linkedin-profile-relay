name: Publish to Chrome Web Store

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          lfs: true
          submodules: true

      - name: Check out release tooling
        uses: actions/checkout@v5
        with:
          path: release-tooling

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & integration tests
        run: pnpm test

      - name: Build prod
        run: pnpm build:prod

      - name: Create ZIP
        run: cd dist-prod && zip -r ../linkedin-profile-relay.zip .

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: q32-tools
          workload_identity_provider: projects/105524363466/locations/global/workloadIdentityPools/github-actions/providers/linkedin-profile-relay
          service_account: linkedin-relay-publisher@q32-tools.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false

      - name: Upload & publish to Chrome Web Store
        run: node release-tooling/scripts/publish-chrome-web-store.mjs linkedin-profile-relay.zip
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}

      - name: Create GitHub Release
        run: |
          if gh release view "$RELEASE_TAG"; then
            gh release upload "$RELEASE_TAG" linkedin-profile-relay.zip --clobber
          else
            gh release create "$RELEASE_TAG" linkedin-profile-relay.zip --title "$RELEASE_TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
