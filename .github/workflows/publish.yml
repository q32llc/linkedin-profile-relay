name: Publish to Chrome Web Store

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          submodules: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & integration tests
        run: pnpm test

      - name: Build prod
        run: pnpm build:prod

      - name: Create ZIP
        run: cd dist-prod && zip -r ../linkedin-profile-relay.zip .

      - name: Upload & publish to Chrome Web Store
        run: |
          if [[ -n "$PUBLISHER_ID" ]]; then
            npx chrome-webstore-upload-cli@4.0.1 upload --source linkedin-profile-relay.zip --extension-id "${{ secrets.CHROME_EXTENSION_ID }}" --auto-publish
          else
            # V1 remains supported until October 15, 2026 and does not require a publisher ID.
            npx chrome-webstore-upload-cli@2.2.2 upload --source linkedin-profile-relay.zip --extension-id "${{ secrets.CHROME_EXTENSION_ID }}" --auto-publish
          fi
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}

      - name: Create GitHub Release
        run: |
          if gh release view "$RELEASE_TAG"; then
            gh release upload "$RELEASE_TAG" linkedin-profile-relay.zip --clobber
          else
            gh release create "$RELEASE_TAG" linkedin-profile-relay.zip --title "$RELEASE_TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
